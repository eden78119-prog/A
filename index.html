<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>工程助手 V4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
header{background:#1f2937;color:#fff;padding:20px 16px;text-align:center;position:sticky;top:0;z-index:3}h1{margin:0;font-size:24px}.sub{font-size:13px;opacity:.8}
main{max-width:720px;margin:auto;padding:12px}.card{background:#fff;border-radius:16px;padding:15px;margin:11px 0;box-shadow:0 2px 9px #0001}
h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{font-size:12px;color:#4b5563}
input,select,textarea{width:100%;padding:11px;margin-top:4px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}textarea{min-height:80px}
button{width:100%;padding:12px;border:0;border-radius:10px;margin-top:9px;background:#1f2937;color:#fff;font-weight:700}.danger{background:#fee2e2;color:#991b1b}
.item{border:1px solid #e5e7eb;border-radius:11px;padding:10px;margin-top:8px}.result{text-align:center;font-size:28px;font-weight:800;padding:10px}.total{text-align:right;font-size:22px;font-weight:800;margin-top:10px}.small{font-size:12px;color:#6b7280}
.photo{width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-top:8px}
@media(max-width:430px){.grid{grid-template-columns:1fr}}@media print{header,main{display:none!important}#print{display:block!important;padding:20px}#print table{width:100%;border-collapse:collapse}#print th,#print td{border:1px solid #777;padding:7px}}#print{display:none}
</style></head>
<body>
<header><h1>🏗️ 工程助手</h1><div class="sub">V4｜計算・專案・報價・材料・人工・支出・施工紀錄</div></header>
<main>

<section class="card"><h2>🏠 工程專案</h2><div class="grid">
<div><label>工程名稱</label><input id="pn" placeholder="例如：王先生自用住宅"></div>
<div><label>地點</label><input id="pl"></div><div><label>客戶</label><input id="pc"></div>
<div><label>工程預算</label><input id="pb" type="number" value="0"></div></div>
<button onclick="project()">💾 儲存工程</button><div id="projects"></div></section>

<section class="card"><h2>🧮 工程計算</h2>
<div class="grid"><div><label>混凝土長 m</label><input id="cl" type="number" value="4.3"></div><div><label>寬 m</label><input id="cw" type="number" value="6.3"></div>
<div><label>厚 cm</label><input id="ct" type="number" value="18"></div><div><label>數量</label><input id="cq" type="number" value="2"></div>
<div><label>單價/m³</label><input id="cp" type="number" value="3200"></div><div><label>損耗%</label><input id="cwa" type="number" value="0"></div></div>
<button onclick="concrete()">混凝土計算</button><div id="co"></div><hr>
<div class="grid"><div><label>鋼筋號數</label><select id="bn"><option value="3">#3 D10</option><option value="4">#4 D13</option><option value="5" selected>#5 D16</option><option value="6">#6 D19</option><option value="7">#7 D22</option><option value="8">#8 D25</option></select></div>
<div><label>總長 m</label><input id="bl" type="number" value="100"></div><div><label>單價/kg</label><input id="bp" type="number" value="23"></div></div>
<button onclick="bar()">鋼筋重量</button><div id="bo"></div><hr>
<div class="grid"><div><label>磁磚面積 m²</label><input id="ta" type="number" value="20"></div><div><label>磚長 cm</label><input id="tx" type="number" value="60"></div>
<div><label>磚寬 cm</label><input id="ty" type="number" value="60"></div><div><label>損耗%</label><input id="twa" type="number" value="5"></div>
<div><label>每箱片數</label><input id="tb" type="number" value="4"></div><div><label>單片價格</label><input id="tp" type="number" value="150"></div></div>
<button onclick="tile()">磁磚數量</button><div id="to"></div></section>

<section class="card"><h2>💰 報價／請款</h2><div class="grid">
<div><label>項目</label><input id="qn" value="貼磚工程"></div><div><label>單位</label><input id="qu" value="m²"></div>
<div><label>數量</label><input id="qq" type="number" value="20"></div><div><label>單價</label><input id="qp" type="number" value="1300"></div></div>
<button onclick="quote()">＋加入報價</button><div id="quotes"></div><div class="total">報價：$<span id="qt">0</span></div>
<button onclick="printQuote()">📄 列印／另存 PDF</button></section>


<section class="card"><h2>📐 模板工程計算</h2>
<div class="grid">
<div><label>構件</label><select id="tc"><option value="column">柱</option><option value="beam">樑</option><option value="wall">牆</option><option value="slab">版／地坪</option></select></div>
<div><label>數量</label><input id="tq" type="number" value="4"></div>
<div><label>長度 m</label><input id="tl" type="number" step="0.01" value="0.25"></div>
<div><label>寬度 m</label><input id="tw" type="number" step="0.01" value="0.35"></div>
<div><label>高度 m</label><input id="th" type="number" step="0.01" value="3.1"></div>
<div><label>單價／m²</label><input id="tp2" type="number" value="1100"></div>
</div>
<button onclick="templateCalc()">計算模板面積</button>
<div id="templateOut"></div>
<div class="small">柱：2×(長＋寬)×高×數量；樑：(2×高＋寬)×長×數量；牆：2×長×高×數量；版／地坪：長×寬×數量。</div>
</section>

<section class="card"><h2>📦 材料庫存</h2><div class="grid">
<div><label>材料</label><input id="mn" value="水泥"></div><div><label>單位</label><input id="mu" value="包"></div>
<div><label>庫存</label><input id="ms" type="number" value="10"></div><div><label>單價</label><input id="mp" type="number" value="180"></div></div>
<button onclick="material()">＋新增／更新</button><div id="materials"></div></section>

<section class="card"><h2>👷 人工費</h2><div class="grid">
<div><label>工種</label><input id="ln" value="泥作"></div><div><label>人數</label><input id="lp" type="number" value="2"></div>
<div><label>天數</label><input id="ld" type="number" value="1"></div><div><label>日薪</label><input id="lw" type="number" value="3000"></div></div>
<button onclick="labor()">＋加入人工</button><div id="labors"></div><div class="total">人工：$<span id="lt">0</span></div></section>

<section class="card"><h2>💸 工程支出</h2><div class="grid">
<div><label>日期</label><input id="ed" type="date"></div><div><label>類別</label><select id="ec"><option>材料</option><option>人工</option><option>油資</option><option>停車</option><option>機具</option><option>其他</option></select></div>
<div><label>說明</label><input id="ee"></div><div><label>金額</label><input id="ea" type="number" value="0"></div></div>
<button onclick="expense()">＋加入支出</button><div id="expenses"></div><div class="total">支出：$<span id="et">0</span></div></section>

<section class="card"><h2>📝 每日施工紀錄</h2><div class="grid">
<div><label>日期</label><input id="rd" type="date"></div><div><label>人員</label><input id="rw"></div></div>
<label>工作內容</label><textarea id="rc"></textarea><label>備註</label><textarea id="rn"></textarea>
<button onclick="record()">＋儲存紀錄</button><div id="records"></div></section>

<section class="card"><h2>📸 工地照片</h2><input id="photo" type="file" accept="image/*" multiple>
<div class="small">照片儲存在這支手機的瀏覽器資料中。</div><div id="photos"></div></section>

<section class="card"><h2>📊 工程成本／利潤</h2><div class="grid">
<div><label>工程收入</label><input id="income" type="number" value="100000"></div><div><label>材料費</label><input id="cm" type="number" value="0"></div>
<div><label>人工費</label><input id="clabor" type="number" value="0"></div><div><label>其他費用</label><input id="co2" type="number" value="0"></div></div>
<button onclick="profit()">計算利潤</button><div id="po"></div></section>

<section class="card"><h2>💾 工程資料備份</h2><button onclick="backup()">下載工程資料備份</button>
<input type="file" accept=".json" onchange="restore(this)"><div class="small">可備份專案、報價、材料、人工、支出、施工紀錄與照片。</div></section>
</main><div id="print"></div>

<script>
const $=x=>document.getElementById(x),N=x=>Number($(x).value)||0,M=x=>Math.round(x).toLocaleString("zh-TW");
let d=JSON.parse(localStorage.getItem("engV4")||'{"projects":[],"quotes":[],"materials":[],"labors":[],"expenses":[],"records":[],"photos":[]}');
function save(){localStorage.setItem("engV4",JSON.stringify(d));render()}
function rm(k,i){d[k].splice(i,1);save()}
function project(){d.projects.unshift({n:$("pn").value,l:$("pl").value,c:$("pc").value,b:N("pb")});save()}
function concrete(){let v=N("cl")*N("cw")*N("ct")/100*N("cq")*(1+N("cwa")/100);$("co").innerHTML='<div class="result">'+v.toFixed(3)+' m³</div><div>金額：$'+M(v*N("cp"))+'</div>'}
function bar(){let z={3:10,4:13,5:16,6:19,7:22,8:25}[$("bn").value],kg=N("bl")*z*z/162;$("bo").innerHTML='<div class="result">'+kg.toFixed(2)+' kg</div><div>材料費：$'+M(kg*N("bp"))+'</div>'}
function tile(){let a=N("tx")/100*N("ty")/100,q=Math.ceil(N("ta")/a*(1+N("twa")/100));$("to").innerHTML='<div class="result">'+q+' 片</div><div>箱數：'+Math.ceil(q/N("tb"))+' 箱｜材料費：$'+M(q*N("tp"))+'</div>'}
function projectCard(x,i){return '<div class=item><b>'+esc(x.n||"未命名工程")+'</b><div class=small>'+esc(x.l||"")+'｜客戶：'+esc(x.c||"—")+'｜預算 $'+M(x.b)+'</div><button class=danger onclick="rm('projects','+i+')">刪除</button></div>'}
function quote(){d.quotes.push({n:$("qn").value,u:$("qu").value,q:N("qq"),p:N("qp")});save()}
function material(){let i=d.materials.findIndex(x=>x.n===$("mn").value),x={n:$("mn").value,u:$("mu").value,s:N("ms"),p:N("mp")};if(i>=0)d.materials[i]=x;else d.materials.push(x);save()}
function labor(){d.labors.push({n:$("ln").value,p:N("lp"),d:N("ld"),w:N("lw")});save()}
function expense(){d.expenses.push({date:$("ed").value||new Date().toISOString().slice(0,10),cat:$("ec").value,e:$("ee").value,a:N("ea")});save()}
function record(){d.records.push({date:$("rd").value||new Date().toISOString().slice(0,10),w:$("rw").value,c:$("rc").value,n:$("rn").value});save()}
function render(){
$("projects").innerHTML=d.projects.map(projectCard).join("");
let qt=0;$("quotes").innerHTML=d.quotes.map((x,i)=>{let s=x.q*x.p;qt+=s;return '<div class=item>'+esc(x.n)+'｜'+x.q+' '+esc(x.u)+' × $'+M(x.p)+' = <b>$'+M(s)+'</b><button class=danger onclick="rm('quotes','+i+')">刪除</button></div>'}).join("");$("qt").textContent=M(qt);
$("materials").innerHTML=d.materials.map((x,i)=>'<div class=item><b>'+esc(x.n)+'</b>｜'+x.s+' '+esc(x.u)+'｜$'+M(x.p)+'<button class=danger onclick="rm('materials','+i+')">刪除</button></div>').join("");
let lt=0;$("labors").innerHTML=d.labors.map((x,i)=>{let s=x.p*x.d*x.w;lt+=s;return '<div class=item>'+esc(x.n)+'｜'+x.p+'人 × '+x.d+'天 × $'+M(x.w)+' = <b>$'+M(s)+'</b><button class=danger onclick="rm('labors','+i+')">刪除</button></div>'}).join("");$("lt").textContent=M(lt);
let et=0;$("expenses").innerHTML=d.expenses.map((x,i)=>{et+=x.a;return '<div class=item>'+x.date+'｜'+esc(x.cat)+'｜'+esc(x.e||"—")+'｜<b>$'+M(x.a)+'</b><button class=danger onclick="rm('expenses','+i+')">刪除</button></div>'}).join("");$("et").textContent=M(et);
$("records").innerHTML=d.records.map((x,i)=>'<div class=item><b>'+x.date+'</b>｜'+esc(x.w||"—")+'<div>'+esc(x.c||"")+'</div><div class=small>'+esc(x.n||"")+'</div><button class=danger onclick="rm('records','+i+')">刪除</button></div>').join("");
$("photos").innerHTML=d.photos.map((x,i)=>'<div class=item><img class=photo src="'+x+'"><button class=danger onclick="rm('photos','+i+')">刪除照片</button></div>').join("")}
function profit(){let c=N("cm")+N("clabor")+N("co2"),p=N("income")-c;$("po").innerHTML='<div class=result>$'+M(p)+'</div><div>總成本：$'+M(c)+'｜毛利率：'+(N("income")?(p/N("income")*100).toFixed(1):0)+'%</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
$("photo").addEventListener("change",e=>[...e.target.files].forEach(f=>{let r=new FileReader();r.onload=()=>{d.photos.push(r.result);save()};r.readAsDataURL(f)}));
function printQuote(){let rows=d.quotes.map((x,i)=>'<tr><td>'+String(i+1)+'</td><td>'+esc(x.n)+'</td><td>'+x.q+' '+esc(x.u)+'</td><td>$'+M(x.p)+'</td><td>$'+M(x.q*x.p)+'</td></tr>').join("");$("print").innerHTML='<h1>工程報價單</h1><table><tr><th>項次</th><th>項目</th><th>數量</th><th>單價</th><th>小計</th></tr>'+rows+'</table><h2>合計：$'+$("qt").textContent+'</h2>';window.print()}
function backup(){let b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="工程助手V4備份.json";a.click()}
function restore(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{d=JSON.parse(r.result);save();alert("還原成功")}catch(e){alert("備份檔格式不正確")}};r.readAsText(f)}
render();

function templateCalc(){
  const type=$("tc").value,q=N("tq"),l=N("tl"),w=N("tw"),h=N("th"),p=N("tp2");
  let area=0,formula="";
  if(type==="column"){area=2*(l+w)*h*q;formula="2×(長＋寬)×高×數量";}
  else if(type==="beam"){area=(2*h+w)*l*q;formula="(2×高＋寬)×長×數量";}
  else if(type==="wall"){area=2*l*h*q;formula="2×長×高×數量";}
  else {area=l*w*q;formula="長×寬×數量";}
  $("templateOut").innerHTML='<div class="result">'+area.toFixed(2)+' m²</div><div class="item">計算方式：'+formula+'<br>預估模板費：<b>$'+M(area*p)+'</b></div>';
}

</script></body></html>
