<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="工程計算工具箱"><meta name="theme-color" content="#1f2937"><link rel="manifest" href="manifest.json"><title>工程計算工具箱 V2</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f3f4f6;color:#111827}header{background:#1f2937;color:white;padding:22px 18px;text-align:center}h1{margin:0;font-size:24px}.sub{opacity:.8;font-size:13px;margin-top:5px}main{max-width:720px;margin:auto;padding:14px 14px 45px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000d}h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;color:#4b5563}input,select{width:100%;margin-top:5px;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:white}button{width:100%;border:0;border-radius:11px;padding:13px;font-size:16px;font-weight:700;background:#1f2937;color:white;margin-top:12px}button.secondary{background:#e5e7eb;color:#111827}.result{font-size:30px;font-weight:800;text-align:center;padding:10px 0}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eee;padding:9px 0}.money{font-weight:800}.small{font-size:12px;color:#6b7280;line-height:1.5}.item{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:10px;background:#fafafa}.total{font-size:22px;font-weight:800;text-align:right;margin-top:12px}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>🏗️ 工程計算工具箱</h1><div class="sub">V2｜混凝土・鋼筋・模板・磚牆・磁磚・油漆・報價</div></header><main>
<section class="card"><h2>① 混凝土計算</h2><div class="grid"><div><label>長度（m）</label><input id="cl" type="number" step="0.01" value="4.3"></div><div><label>寬度（m）</label><input id="cw" type="number" step="0.01" value="6.3"></div><div><label>厚度（cm）</label><input id="ct" type="number" step="0.1" value="18"></div><div><label>數量</label><input id="cq" type="number" value="2"></div><div><label>混凝土單價（元/m³）</label><input id="cp" type="number" value="3200"></div></div><button onclick="calcConcrete()">計算混凝土</button><div id="concreteOut"></div></section>
<section class="card"><h2>② 鋼筋重量</h2><div class="grid"><div><label>鋼筋號數</label><select id="bar"><option value="3">#3（D10）</option><option value="4">#4（D13）</option><option value="5" selected>#5（D16）</option><option value="6">#6（D19）</option><option value="7">#7（D22）</option><option value="8">#8（D25）</option><option value="9">#9（D29）</option><option value="10">#10（D32）</option></select></div><div><label>總長度（m）</label><input id="bl" type="number" value="100"></div><div><label>單價（元/kg）</label><input id="bp" type="number" value="23"></div></div><button onclick="calcBar()">計算鋼筋</button><div id="barOut"></div><div class="small">理論重量採 d² ÷ 162（kg/m），實際採購請依材料規格確認。</div></section>
<section class="card"><h2>③ 面積／坪數</h2><div class="grid"><div><label>長度（m）</label><input id="al" type="number" value="10"></div><div><label>寬度（m）</label><input id="aw" type="number" value="5"></div></div><button onclick="calcArea()">計算面積</button><div id="areaOut"></div></section>
<section class="card"><h2>④ 模板工程</h2><div class="grid"><div><label>構件</label><select id="tc"><option value="column">柱</option><option value="beam">樑</option><option value="wall">牆</option><option value="slab">版／地坪</option></select></div><div><label>數量</label><input id="tq" type="number" value="4"></div><div><label>長度（m）</label><input id="tl" type="number" value="0.25"></div><div><label>寬度（m）</label><input id="tw" type="number" value="0.35"></div><div><label>高度（m）</label><input id="th" type="number" value="3.1"></div><div><label>模板單價（元/m²）</label><input id="tp" type="number" value="1100"></div></div><button onclick="calcTemplate()">計算模板</button><div id="templateOut"></div></section>
<section class="card"><h2>⑤ 磚牆數量</h2><div class="grid"><div><label>牆長（m）</label><input id="brickL" type="number" value="10"></div><div><label>牆高（m）</label><input id="brickH" type="number" value="3"></div><div><label>每 m² 用磚數（塊）</label><input id="brickRate" type="number" value="100"></div><div><label>損耗率（%）</label><input id="brickWaste" type="number" value="5"></div><div><label>單價（元/塊）</label><input id="brickP" type="number" value="8"></div></div><button onclick="calcBrick()">計算磚牆</button><div id="brickOut"></div></section>
<section class="card"><h2>⑥ 磁磚數量</h2><div class="grid"><div><label>施工面積（m²）</label><input id="tileArea" type="number" value="50"></div><div><label>磁磚長（cm）</label><input id="tileL" type="number" value="60"></div><div><label>磁磚寬（cm）</label><input id="tileW" type="number" value="60"></div><div><label>損耗率（%）</label><input id="tileWaste" type="number" value="5"></div><div><label>單價（元/片）</label><input id="tileP" type="number" value="80"></div></div><button onclick="calcTile()">計算磁磚</button><div id="tileOut"></div></section>
<section class="card"><h2>⑦ 油漆／防水材料</h2><div class="grid"><div><label>施工面積（m²）</label><input id="paintArea" type="number" value="100"></div><div><label>每桶施工面積（m²）</label><input id="paintCoverage" type="number" value="25"></div><div><label>損耗率（%）</label><input id="paintWaste" type="number" value="10"></div><div><label>每桶單價（元）</label><input id="paintP" type="number" value="1200"></div></div><button onclick="calcPaint()">計算材料</button><div id="paintOut"></div></section>
<section class="card"><h2>⑧ 單筆金額</h2><div class="grid"><div><label>數量</label><input id="mq" type="number" value="10"></div><div><label>單價（元）</label><input id="mp" type="number" value="800"></div></div><button onclick="calcMoney()">計算金額</button><div id="moneyOut"></div></section>
<section class="card"><h2>⑨ 工程報價／請款清單</h2><div class="grid"><div><label>項目</label><input id="quoteName" placeholder="例如：地磚貼作"></div><div><label>單位</label><input id="quoteUnit" placeholder="m²"></div><div><label>數量</label><input id="quoteQty" type="number" value="1"></div><div><label>單價（元）</label><input id="quotePrice" type="number" value="1000"></div></div><button onclick="addQuote()">＋加入項目</button><div id="quoteList"></div><div class="total">總計：$<span id="quoteTotal">0</span></div></section>
<section class="card"><button class="secondary" onclick="clearAll()">清除計算結果</button></section></main>
<script>const n=id=>Number(document.getElementById(id).value)||0;const money=x=>Math.round(x).toLocaleString('zh-TW');
function calcConcrete(){let v=n('cl')*n('cw')*n('ct')/100*n('cq');concreteOut.innerHTML='<div class="result">'+v.toFixed(4)+' m³</div><div class="row"><span>預估金額</span><span class="money">$'+money(v*n('cp'))+'</span></div>'}
function calcBar(){const d={3:10,4:13,5:16,6:19,7:22,8:25,9:29,10:32}[bar.value],kg=n('bl')*d*d/162;barOut.innerHTML='<div class="result">'+kg.toFixed(2)+' kg</div><div class="row"><span>預估材料費</span><span class="money">$'+money(kg*n('bp'))+'</span></div>'}
function calcArea(){let a=n('al')*n('aw');areaOut.innerHTML='<div class="result">'+a.toFixed(2)+' m²</div><div class="row"><span>坪數</span><span>'+ (a/3.305785).toFixed(2)+' 坪</span></div>'}
function calcTemplate(){let t=tc.value,l=n('tl'),w=n('tw'),h=n('th'),q=n('tq'),a=t==='column'?2*(l+w)*h*q:t==='beam'?(2*h+w)*l*q:t==='wall'?2*l*h*q:l*w*q;templateOut.innerHTML='<div class="result">'+a.toFixed(2)+' m²</div><div class="row"><span>預估模板費</span><span class="money">$'+money(a*n('tp'))+'</span></div>'}
function calcBrick(){let a=n('brickL')*n('brickH'),q=Math.ceil(a*n('brickRate')*(1+n('brickWaste')/100));brickOut.innerHTML='<div class="result">'+q.toLocaleString()+' 塊</div><div class="row"><span>牆面積</span><span>'+a.toFixed(2)+' m²</span></div><div class="row"><span>材料費</span><span class="money">$'+money(q*n('brickP'))+'</span></div>'}
function calcTile(){let pa=n('tileL')/100*n('tileW')/100,q=Math.ceil(n('tileArea')/pa*(1+n('tileWaste')/100));tileOut.innerHTML='<div class="result">'+q.toLocaleString()+' 片</div><div class="row"><span>每片面積</span><span>'+pa.toFixed(4)+' m²</span></div><div class="row"><span>材料費</span><span class="money">$'+money(q*n('tileP'))+'</span></div>'}
function calcPaint(){let q=Math.ceil(n('paintArea')*(1+n('paintWaste')/100)/n('paintCoverage'));paintOut.innerHTML='<div class="result">'+q+' 桶</div><div class="row"><span>材料費</span><span class="money">$'+money(q*n('paintP'))+'</span></div>'}
function calcMoney(){moneyOut.innerHTML='<div class="result">$'+money(n('mq')*n('mp'))+'</div>'}
let quotes=[];function addQuote(){quotes.push({name:quoteName.value.trim()||'未命名項目',unit:quoteUnit.value.trim()||'式',qty:n('quoteQty'),price:n('quotePrice')});renderQuotes()}function renderQuotes(){quoteList.innerHTML=quotes.map((x,i)=>'<div class="item"><div class="row"><b>'+(i+1)+'. '+x.name+'</b><button style="width:auto;margin:0;padding:6px 10px;background:#fee2e2;color:#991b1b" onclick="removeQuote('+i+')">刪除</button></div><div class="row"><span>'+x.qty+' '+x.unit+' × $'+money(x.price)+'</span><span class="money">$'+money(x.qty*x.price)+'</span></div></div>').join('');quoteTotal.textContent=money(quotes.reduce((s,x)=>s+x.qty*x.price,0))}function removeQuote(i){quotes.splice(i,1);renderQuotes()}function clearAll(){document.querySelectorAll('[id$="Out"]').forEach(x=>x.innerHTML='');quotes=[];renderQuotes()}if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script></body></html>
